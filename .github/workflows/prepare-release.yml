name: Prepare Release

on:
  push:
    branches: [main]

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    if: "!startsWith(github.event.head_commit.message, 'release:')"
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Compute next version
        id: semver
        run: |
          LAST_TAG=$(git describe --tags --match "v*" --abbrev=0 2>/dev/null || echo "")
          RANGE="${LAST_TAG:+${LAST_TAG}..}HEAD"

          COMMITS=$(git log --pretty=format:"%s" "$RANGE")
          if [ -z "$COMMITS" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BUMP=patch
          while IFS= read -r msg; do
            case "$msg" in
              *'!'*:*) BUMP=major; break ;;
              feat:*) BUMP=minor ;;
            esac
          done <<< "$COMMITS"

          CURRENT="${LAST_TAG#v}"
          CURRENT="${CURRENT:-0.0.0}"
          IFS='.' read -r MA MI PA <<< "$CURRENT"
          case "$BUMP" in
            major) MA=$((MA+1)); MI=0; PA=0 ;;
            minor) MI=$((MI+1)); PA=0 ;;
            patch) PA=$((PA+1)) ;;
          esac

          {
            echo "version=$MA.$MI.$PA"
            echo "tag=v$MA.$MI.$PA"
            echo "bump=$BUMP"
            echo "skip=false"
            echo "commits<<EOF"
            git log --pretty=tformat:"- %s" "$RANGE"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Update marketplace.json
        if: steps.semver.outputs.skip == 'false'
        env:
          VERSION: ${{ steps.semver.outputs.version }}
          TAG: ${{ steps.semver.outputs.tag }}
          SHA: ${{ github.sha }}
        run: |
          jq --arg v "$VERSION" --arg r "$TAG" --arg s "$SHA" \
            '.plugins[0].version = $v | .plugins[0].source.ref = $r | .plugins[0].source.sha = $s' \
            .claude-plugin/marketplace.json > /tmp/marketplace.json
          mv /tmp/marketplace.json .claude-plugin/marketplace.json

      - name: Push release branch
        if: steps.semver.outputs.skip == 'false'
        env:
          TAG: ${{ steps.semver.outputs.tag }}
          SHA: ${{ github.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="release/$TAG"

          # Create branch or force-move it to the content commit
          if gh api "repos/$GITHUB_REPOSITORY/git/refs/heads/$BRANCH" --silent 2>/dev/null; then
            gh api "repos/$GITHUB_REPOSITORY/git/refs/heads/$BRANCH" \
              --method PATCH -f "sha=$SHA" -F "force=true"
          else
            gh api "repos/$GITHUB_REPOSITORY/git/refs" \
              --method POST -f "ref=refs/heads/$BRANCH" -f "sha=$SHA"
          fi

          # Commit the updated file via API — GitHub signs it automatically
          FILE_SHA=$(gh api "repos/$GITHUB_REPOSITORY/contents/.claude-plugin/marketplace.json?ref=$BRANCH" --jq '.sha')
          gh api "repos/$GITHUB_REPOSITORY/contents/.claude-plugin/marketplace.json" \
            --method PUT \
            -f "message=release: $TAG" \
            -f "content=$(base64 -w 0 < .claude-plugin/marketplace.json)" \
            -f "sha=$FILE_SHA" \
            -f "branch=$BRANCH"

      - name: Open or update release PR
        if: steps.semver.outputs.skip == 'false'
        env:
          TAG: ${{ steps.semver.outputs.tag }}
          VERSION: ${{ steps.semver.outputs.version }}
          BUMP: ${{ steps.semver.outputs.bump }}
          COMMITS: ${{ steps.semver.outputs.commits }}
          SHA: ${{ github.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="release/$TAG"
          TITLE="release: $TAG"
          {
            printf '## %s (%s bump)\n\n' "$TAG" "$BUMP"
            printf '%s\n' "$COMMITS"
            printf '\n---\nPins to `%s` and bumps version to `%s`. Merge to release.\n' "$SHA" "$VERSION"
          } > /tmp/pr-body.md
          EXISTING=$(gh pr list --head "$BRANCH" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh pr edit "$EXISTING" --title "$TITLE" --body-file /tmp/pr-body.md
          else
            gh pr create --title "$TITLE" --body-file /tmp/pr-body.md --base main --head "$BRANCH"
          fi
